name: Dev build (/dev)

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  build-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown

      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build WASM + /dev web bundle
        working-directory: app
        run: |
          npm ci
          npm run build:wasm
          npm run build:web:dev

      - name: Commit dev/ artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/ app/src/wasm/
          git diff --staged --quiet || git commit -m "ci(dev): rebuild /dev bundle [skip ci]"
          git push
