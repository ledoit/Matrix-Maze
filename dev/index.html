<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Game name: "Matrix Maze" - if changing, update src/constants.js -->
    <title>Matrix Maze</title>
    
  <script type="module" crossorigin src="/dev/assets/index-47477caa.js"></script>
  <link rel="stylesheet" href="/dev/assets/index-15e1b674.css">
</head>
<body>
    <div id="app">
        <div id="level-indicator">Level 1</div>
        <button id="pause-btn" type="button" aria-label="Pause game">Pause</button>
        <div id="viewport"></div>
        <div id="controls">
            <p>WASD: Move | Q/E: Turn | SPACE or tap: Next Level (after win)</p>
        </div>
    </div>
    <!-- Touch controls (mobile web only, shown via pointer:coarse media query) -->
    <div id="touch-controls" aria-hidden="true">
        <!-- Bottom-left: movement laid out like keyboard arrow keys (forward/back + strafe) -->
        <div class="touch-cluster touch-move">
            <button type="button" class="touch-btn move-forward" data-key="w" aria-label="Move forward">&#9650;</button>
            <button type="button" class="touch-btn move-left" data-key="a" aria-label="Strafe left">&#9664;</button>
            <button type="button" class="touch-btn move-back" data-key="s" aria-label="Move backward">&#9660;</button>
            <button type="button" class="touch-btn move-right" data-key="d" aria-label="Strafe right">&#9654;</button>
        </div>
        <!-- Bottom-right: turn/rotate view left and right -->
        <div class="touch-cluster touch-turn">
            <button type="button" class="touch-btn turn-left" data-key="q" aria-label="Turn left">&#9664;</button>
            <button type="button" class="touch-btn turn-right" data-key="e" aria-label="Turn right">&#9654;</button>
        </div>
    </div>
    <div id="rotate-prompt" aria-live="polite">
        Rotate your device to landscape for the best experience.
    </div>
    
</body>
</html>
